<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Game - Custom Theme</title>
    <style>
        /* Basic Reset and Layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Styles */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        header nav {
            margin-top: 0.5rem;
        }

        header nav a {
            color: white;
            text-decoration: none;
            margin: 0 1rem;
            font-weight: bold;
        }

        header nav a:hover {
            color: #3498db;
        }

        /* Main Content Container */
        .main-container {
            flex: 1;
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            width: 100%;
            padding: 0 20px;
        }

        /* Ad Sections */
        .ad-sidebar {
            width: 200px;
            background-color: #ecf0f1;
            padding: 15px;
            margin: 0 10px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .ad-sidebar h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .ad-placeholder {
            background-color: #ddd;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            border-radius: 3px;
        }

        /* Game Container */
        .game-container {
            flex: 1;
            margin: 0 10px;
        }

        .game-iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Footer Styles */
        footer {
            background-color: #2c3e50;
            color: white;
            padding: 1rem;
            text-align: center;
            margin-top: auto;
        }

        footer a {
            color: #3498db;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }

            .ad-sidebar {
                width: 100%;
                margin: 10px 0;
            }

            .game-iframe {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header>
        <h1>Dino Adventure Hub</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#games">Games</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Left Ad Section -->
        <aside class="ad-sidebar">
            <h3>Sponsor</h3>
            <div class="ad-placeholder">Advertisement 300x250</div>
        </aside>

        <!-- Game Section -->
        <section class="game-container">
            <iframe class="game-iframe" srcdoc='
                <!DOCTYPE html>
                <html>
                <head>
                    <title>T-Rex Game</title>
                    <meta name="description" content="Ripped T-Rex/Dino game of Chromium">
                    <!-- Your original head content here -->
                </head>
                <body>
                    <!-- Your original body content here -->
                    <div class="interstitial-wrapper">
                        <!-- All your game content -->
                    </div>
                    <script type="text/javascript">
                        if (navigator.userAgent.toLowerCase().indexOf("chrome") > -1) {
                            new Runner(".interstitial-wrapper");
                        } else {
                            document.getElementById("main-frame-notchrome").style.display="";
                        }
                    </script>
                </body>
                </html>
            '></iframe>
        </section>

        <!-- Right Ad Section -->
        <aside class="ad-sidebar">
            <h3>Sponsor</h3>
            <div class="ad-placeholder">Advertisement 300x250</div>
        </aside>
    </div>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2025 Dino Adventure Hub. All rights reserved.</p>
        <p><a href="#privacy">Privacy Policy</a> | <a href="#terms">Terms of Service</a></p>
    </footer>
</body>
</html>
