<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Chrome Easter Egg: T-Rex Runner</title>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
        <script src="index.js"></script>
    </head>
    <body id="t" class="offline">
        <!-- Header Section -->
        <header>
            <a href="/">
                <img src="[PATH_TO_LOGO]" alt="T-Rex Logo" class="logo">
            </a>
        </header>

        <!-- Main Content Wrapper -->
        <div class="content-wrapper">
            <div id="messageBox" class="sendmessage">
                <h1 style="text-align: center; font-family: 'Open Sans', sans-serif;">Press Space to Start</h1>
                <div class="niokbutton" onclick="okbuttonsend()"></div>
            </div>
            <div id="main-frame-error" class="interstitial-wrapper">
                <div id="main-content">
                    <div class="icon icon-offline" alt=""></div>
                </div>
                <div id="offline-resources">
                    <img id="offline-resources-1x" src="assets/default_100_percent/100-offline-sprite.png">
                    <img id="offline-resources-2x" src="assets/default_200_percent/200-offline-sprite.png">
                    <template id="audio-resources">
                        <!-- Replace the src paths below with your own audio file paths -->
                        <audio id="offline-sound-press" src="[YOUR_PATH_TO_OFFLINE_SOUND_PRESS]"></audio>
                        <audio id="offline-sound-hit" src="[YOUR_PATH_TO_OFFLINE_SOUND_HIT]"></audio>
                        <audio id="offline-sound-reached" src="[YOUR_PATH_TO_OFFLINE_SOUND_REACHED]"></audio>
                    </template>
                </div>
            </div>
        </div>

        <!-- Footer Section -->
        <footer>
            <div class="footer-left">
                © 2025 Dino-Chrome. All rights reserved.
            </div>
            <div class="footer-right">
                <a href="/about-us">About Us</a>
                <span class="separator">|</span>
                <a href="/contact-us">Contact Us</a>
                <span class="separator">|</span>
                <a href="/privacy-policy">Privacy Policy</a>
                <span class="separator">|</span>
                <a href="https://www.facebook.com" target="_blank">Facebook</a>
                <span class="separator">|</span>
                <a href="https://www.instagram.com" target="_blank">Instagram</a>
            </div>
        </footer>
    </body>
    <script>
        document.onkeydown = function(evt) {
            evt = evt || window.event;
            if (evt.keyCode == 32) {
                var box = document.getElementById("messageBox");
                box.style.visibility = "hidden";
            }
        };
    </script>
</html>
